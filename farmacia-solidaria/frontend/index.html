<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmácias Solidárias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { background-color: #f8f9fa; }
    .sidebar {
      background-color: #2c8a88;
      color: white;
      height: 100vh;
      padding: 20px;
    }
    .sidebar a {
      display: block;
      margin-bottom: 15px;
      color: white;
      text-decoration: none;
    }
    #map { height: 400px; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
      <h3>Farmácias</h3>
      <a href="#">Produtos</a>
      <a href="#">Sobre</a>
    </div>

    <!-- Conteúdo principal -->
    <div class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <input class="form-control w-50" type="search" placeholder="Buscar farmácia...">
        <button class="btn btn-outline-light bg-white text-dark">Login</button>
      </div>

      <!-- Mapa -->
      <div id="map"></div>

      <!-- Lista -->
      <h4 class="mb-3">Farmácias Solidárias</h4>
      <div id="pharmacy-list" class="row g-3"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // Inicializa mapa
  const map = L.map("map").setView([-23.55052, -46.633308], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
  }).addTo(map);

  // Busca farmácias do backend
  fetch("http://localhost:8080/api/pharmacies")
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById("pharmacy-list");

      data.forEach(p => {
        // Marcador no mapa
        L.marker([p.lat, p.lng]).addTo(map)
          .bindPopup(`<b>${p.name}</b><br>${p.address}<br>${p.description}`);

        // Card de farmácia
        const card = `
          <div class="col-md-6">
            <div class="card p-3">
              <h5>${p.name}</h5>
              <p class="mb-1">${p.address}</p>
              <p>${p.description}</p>
              <button class="btn btn-primary">Ver</button>
            </div>
          </div>
        `;
        list.innerHTML += card;
      });
    })
    .catch(err => console.error("Erro ao carregar farmácias:", err));
</script>
</body>
</html>
